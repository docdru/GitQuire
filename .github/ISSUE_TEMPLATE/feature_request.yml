name: Feature request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Describe the problem you want solved; if you'd like to build it yourself, say so and we can agree on the approach first.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: "The situation you are in and what you are trying to get done, rather than the feature you have in mind. For example: when I …, I want to …, so that …"
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you handle this today?
      description: What you do instead now, and what makes it hard.
    validations:
      required: false
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Optional. Any ideas for how it could work.
    validations:
      required: false
  - type: textarea
    id: done-when
    attributes:
      label: What would you see if it worked?
      description: Describe the behavior that would tell you this is done.
    validations:
      required: false
  - type: textarea
    id: code-pointers
    attributes:
      label: Anything else?
      description: Anything else that might help, such as related issues or code you suspect. Optional.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Editor
        - GitHub sync
        - CLI
        - MCP / agent integration
        - Desktop app
        - Docs
        - Other
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools or approaches you looked at, and why they did not work for you.
    validations:
      required: false
