model = "mistral-large-2512"
max_output_tokens = 32_000

project = """
'GitQuire', a self-hosted collaborative Markdown wiki stored in Git (TypeScript
monorepo with pnpm: packages/app is the React and Tiptap editor, packages/server
the collaboration and sync server, packages/core shared logic, packages/cli the
`gq` command). It runs only as one Linux Docker container with the wiki in the
/data volume. People sign in with their Git host account and may use a wiki only
if they can write to its repository."""

instructions = """
AGENTS.md and CONTRIBUTING.md hold the binding project rules: apply them. The
repository forbids code comments apart from the short allowlist in AGENTS.md;
report a new prose comment as a finding, and never ask for one to be added.
GitQuire's own code lives in packages/*/src/gitquire/, packages/app/src/lib/gitquire/
and packages/app/src/gitquire-*. Code, tests or docs that only matter outside the
Docker image (Windows, macOS, a person's own computer) do not belong here.
Known sensitive areas: sign-in and the session cookie (access-gate.ts), agent
tokens and the /mcp connector sign-in, the Git host token and how it reaches
Git, drafts and their child processes, sync and the hand-over of pulled changes
to open pages, comment threads stored as footnotes, and anything that decides
which person or which path a request may reach."""

reference_docs = [
  { path = "AGENTS.md", role = "binding project rules for contributors and agents", max_chars = 40_000 },
  { path = "CONTRIBUTING.md", role = "pull request rules, naming rules and what CI runs", max_chars = 60_000 },
  { path = "DEPLOY.md", role = "operator documentation: settings and environment variables", max_chars = 80_000 },
  { path = "plans/wikis-and-hosts.md", role = "plan of the wikis-hosts branch: decisions, requirements R1-R18, host interface, order", max_chars = 60_000 },
  { path = "plans/one-front-door.md", role = "plan of the hosts-one-door branch: one front door for several Git hosts, owner's decisions, requirements S1-S9, blocks B0-B9, findings", max_chars = 40_000 },
  { path = "plans/one-mode.md", role = "plan of the one-mode branch: one mode (always the front door), every host in GITQUIRE_HOSTS, old settings refused, requirements O1-O9, blocks, findings and assumptions", max_chars = 40_000 },
  { path = "plans/review-map.md", role = "review map: which module owns what, contract files, seams where one wiki leaks into another or work is lost", max_chars = 30_000 },
]

generated_files = [
  "pnpm-lock.yaml",
  "THIRD_PARTY_NOTICES.md",
  "scripts/old-names-baseline.json",
  "packages/app/tests/integration-durations.json",
  "packages/core/schema-snapshot.json",
  "packages/core/src/schema-snapshot.json",
]
generated_suffixes = [".po"]

[related]
tests = true
imports = true
nearby = true

[[related.rules]]
when = [
  "packages/server/src/gitquire/host/",
  "packages/server/src/gitquire/access-gate.ts",
  "packages/server/src/gitquire/agent-access.ts",
  "packages/server/src/gitquire/github-app.ts",
  "packages/server/src/gitquire/github-pulls.ts",
  "packages/server/src/gitquire/drafts/remote.ts",
]
send = ["packages/server/src/gitquire/host/types.ts"]

[[related.rules]]
when = [
  "packages/server/src/gitquire/access-gate.ts",
  "packages/server/src/gitquire/behind-front-door-gate.ts",
  "packages/server/src/gitquire/internal-request.ts",
  "packages/server/src/gitquire/principal-directory.ts",
  "packages/server/src/gitquire/settings-admin.ts",
  "packages/server/src/collab-bootstrap-url.ts",
  "packages/server/src/gitquire/drafts/http.ts",
  "packages/server/src/gitquire/process-pool/forward.ts",
]
send = ["packages/server/src/gitquire/request-person.ts"]

[[related.rules]]
when = [
  "packages/server/src/gitquire/front-door/",
  "packages/server/src/gitquire/door-token.ts",
  "packages/server/src/gitquire/process-pool/forward.ts",
]
send = ["packages/server/src/gitquire/front-door/access.ts"]

[[sections]]
key = "security"
title = "🔒 Security and access"
security = true
checklist = """
a request that reaches pages, files, live editing, drafts or assistant tools
without the access check; trust in a header, cookie or path the caller controls;
path traversal out of the content folder or into .gitquire/local; tokens, keys
or secrets written to logs, the wiki repository or the browser; a child process
that inherits more environment than it needs; shell or Git arguments built from
user input; GitHub Actions with wider permissions than needed or not pinned."""

[[sections]]
key = "correctness"
title = "🧪 Correctness and tests"
checklist = """
logic errors and unhandled edge cases; behaviour changes without a test; bug
fixes without a regression test; removed, skipped or weakened tests; an edit
that can lose or overwrite a person's unsaved or unpushed work; a failing step
that is retried or silenced instead of fixed."""

[[sections]]
key = "rules"
title = "📐 Project rules and docs"
reference = true
checklist = """
does the change follow AGENTS.md and CONTRIBUTING.md (no code comments, GitQuire
names, user-facing text through Lingui, one topic per pull request, Docker
only)? Does a new or changed setting or environment variable appear in
DEPLOY.md, and does DEPLOY.md still describe what the code does?"""

[[sections]]
key = "plan"
title = "🗺️ Plan consistency"
reference = true
checklist = """
does the change match plans/one-mode.md (requirements O1-O9 and its
assumptions) and the earlier plans plans/wikis-and-hosts.md (R1-R18) and
plans/one-front-door.md (S1-S9)? Does it implement what the pull request's
"Context for the reviewer" says it implements, and does plans/review-map.md
still describe the modules and seams the change touches?"""

[[sections]]
key = "switched_off"
title = "🔌 Existing volumes and old settings"
checklist = """
can a several-wikis volume made by main's image still start with only its
variables renamed, finding every wiki, token, agent token, per-person file and
draft (O1)? Is a single-wiki volume refused before anything is written (O2)?
Can any removed or renamed variable be silently ignored or keep a meaning
under its old name (O3)? Does anything remain that lets a request into a wiki
without the host's access check (O4)?"""
