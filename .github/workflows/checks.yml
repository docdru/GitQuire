name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tests: ${{ steps.plan.outputs.tests }}
      has-tests: ${{ steps.plan.outputs.has-tests }}
      docker: ${{ steps.plan.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          BASE_REF: ${{ github.base_ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          changed="$RUNNER_TEMP/changed-paths.txt"
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD > "$changed"
          else
            : > "$changed"
          fi
          node scripts/ci-plan.mjs --event "$EVENT" --ref "$REF" --base "$BASE_REF" \
            --labels "$LABELS" --changed "$changed"

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          turbo-cache: checks

      - name: Lint
        run: pnpm run lint

      - name: No new old names
        run: node scripts/check-old-names.mjs

      - name: Show the formatting patch
        if: failure()
        run: |
          pnpm exec biome format --write packages docs *.json *.jsonc *.ts >/dev/null 2>&1 || true
          echo "Apply with: git apply <<'PATCH' … PATCH"
          echo "FORMAT-PATCH-BEGIN"
          git --no-pager diff
          echo "FORMAT-PATCH-END"

      - name: Translation catalogs are up to date
        id: catalogs
        run: |
          pnpm --filter @gitquire/app run i18n:extract
          untracked=$(git ls-files --others --exclude-standard -- packages/app/src/locales)
          if [ -n "$untracked" ] || ! git diff --quiet -I '^"POT-Creation-Date' -- packages/app/src/locales; then
            git add -N -- packages/app/src/locales
            git --no-pager diff --stat -- packages/app/src/locales
            echo "CATALOG-PATCH-BEGIN"
            git --no-pager diff -- packages/app/src/locales
            echo "CATALOG-PATCH-END"
            echo "::error::UI strings changed. Run: pnpm --filter @gitquire/app run i18n:extract"
            exit 1
          fi

      - name: Upload the extracted catalogs
        if: failure() && steps.catalogs.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: locales
          path: packages/app/src/locales

      - name: Typecheck server and CLI
        run: >-
          pnpm exec turbo run typecheck
          --filter=@gitquire/core
          --filter=@gitquire/server
          --filter=@gitquire/cli

      - name: Typecheck app
        run: pnpm exec turbo run typecheck --filter=@gitquire/app

      - name: CI script tests
        run: pnpm exec vitest run --config vitest.scripts.config.ts scripts/ci-plan.test.mjs scripts/ci-timings.test.mjs

  tests:
    name: tests (${{ matrix.suite }})
    needs: plan
    if: needs.plan.outputs.has-tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.tests) }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          turbo-cache: ${{ matrix.cache }}
          playwright: ${{ matrix.playwright || 'false' }}

      - name: Build
        run: ${{ matrix.build }}

      - name: Test
        run: ${{ matrix.run }}

  docker:
    needs: plan
    if: needs.plan.outputs.docker == 'true'
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write

  ci-ok:
    if: always()
    needs: [plan, checks, tests, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All needed jobs passed or were skipped by the plan
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e '.plan.result == "success" and .checks.result == "success"' >/dev/null
          echo "$NEEDS" | jq -e '[.[] | .result] | all(. == "success" or . == "skipped")' >/dev/null
