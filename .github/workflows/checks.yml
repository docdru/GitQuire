name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install the declared Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Show the formatting patch
        if: failure()
        run: |
          pnpm exec biome format --write packages docs *.json *.jsonc *.ts >/dev/null 2>&1 || true
          echo "Apply with: git apply <<'PATCH' … PATCH"
          echo "FORMAT-PATCH-BEGIN"
          git --no-pager diff
          echo "FORMAT-PATCH-END"

      - name: Translation catalogs are up to date
        id: catalogs
        run: |
          pnpm --filter @inkeep/open-knowledge-app run i18n:extract
          untracked=$(git ls-files --others --exclude-standard -- packages/app/src/locales)
          if [ -n "$untracked" ] || ! git diff --quiet -I '^"POT-Creation-Date' -- packages/app/src/locales; then
            git add -N -- packages/app/src/locales
            git --no-pager diff --stat -- packages/app/src/locales
            echo "CATALOG-PATCH-BEGIN"
            git --no-pager diff -- packages/app/src/locales
            echo "CATALOG-PATCH-END"
            echo "::error::UI strings changed. Run: pnpm --filter @inkeep/open-knowledge-app run i18n:extract"
            exit 1
          fi

      - name: Upload the extracted catalogs
        if: failure() && steps.catalogs.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: locales
          path: packages/app/src/locales

      - name: Typecheck server and CLI
        run: >-
          pnpm exec turbo run typecheck
          --filter=@inkeep/open-knowledge-core
          --filter=@inkeep/open-knowledge-server
          --filter=@inkeep/open-knowledge

      - name: Typecheck app
        run: pnpm exec turbo run typecheck --filter=@inkeep/open-knowledge-app

      - name: Build server dependencies
        run: pnpm exec turbo run build --filter=@inkeep/open-knowledge-server^...

      - name: Core markdown and GitQuire tests
        run: >-
          pnpm --dir packages/core exec vitest run
          src/gitquire src/markdown src/extensions src/schema-invariant.test.ts

      - name: GitQuire discussion app tests
        run: >-
          pnpm --dir packages/app exec vitest run --config vitest.config.ts
          src/gitquire-comments src/gitquire-mobile src/gitquire-links src/gitquire-settings
          src/lib/gitquire src/editor/provider-pool.server-restart.test.ts

      - name: GitQuire tests
        run: pnpm --dir packages/server exec vitest run src/gitquire

      - name: Upstream tests for modules GitQuire hooks into
        run: >-
          pnpm --dir packages/server exec vitest run
          src/persistence src/sync-engine src/principal src/server-factory.test.ts
          src/mcp-mount src/boot

      - name: GitQuire app tests
        run: pnpm --dir packages/app exec vitest run --config vitest.config.ts src/lib/gitquire
