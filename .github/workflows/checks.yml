name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: No new old names
        run: node scripts/check-old-names.mjs

      - name: Show the formatting patch
        if: failure()
        run: |
          pnpm exec biome format --write packages docs *.json *.jsonc *.ts >/dev/null 2>&1 || true
          echo "Apply with: git apply <<'PATCH' … PATCH"
          echo "FORMAT-PATCH-BEGIN"
          git --no-pager diff
          echo "FORMAT-PATCH-END"

      - name: Translation catalogs are up to date
        id: catalogs
        run: |
          pnpm --filter @gitquire/app run i18n:extract
          untracked=$(git ls-files --others --exclude-standard -- packages/app/src/locales)
          if [ -n "$untracked" ] || ! git diff --quiet -I '^"POT-Creation-Date' -- packages/app/src/locales; then
            git add -N -- packages/app/src/locales
            git --no-pager diff --stat -- packages/app/src/locales
            echo "CATALOG-PATCH-BEGIN"
            git --no-pager diff -- packages/app/src/locales
            echo "CATALOG-PATCH-END"
            echo "::error::UI strings changed. Run: pnpm --filter @gitquire/app run i18n:extract"
            exit 1
          fi

      - name: Upload the extracted catalogs
        if: failure() && steps.catalogs.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: locales
          path: packages/app/src/locales

      - name: Typecheck server and CLI
        run: >-
          pnpm exec turbo run typecheck
          --filter=@gitquire/core
          --filter=@gitquire/server
          --filter=@gitquire/cli

      - name: Typecheck app
        run: pnpm exec turbo run typecheck --filter=@gitquire/app

  tests:
    name: tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: core
            build: pnpm exec turbo run build --filter=@gitquire/core
            run: pnpm --dir packages/core run test
          - suite: server 1/4
            build: pnpm exec turbo run build --filter=@gitquire/server^...
            run: pnpm --dir packages/server exec vitest run --shard=1/4
          - suite: server 2/4
            build: pnpm exec turbo run build --filter=@gitquire/server^...
            run: pnpm --dir packages/server exec vitest run --shard=2/4
          - suite: server 3/4
            build: pnpm exec turbo run build --filter=@gitquire/server^...
            run: pnpm --dir packages/server exec vitest run --shard=3/4
          - suite: server 4/4
            build: pnpm exec turbo run build --filter=@gitquire/server^...
            run: pnpm --dir packages/server exec vitest run --shard=4/4
          - suite: app unit 1/4
            build: >-
              pnpm exec turbo run build --filter=@gitquire/app^...
              && pnpm --dir packages/app exec playwright install --with-deps chromium
            run: pnpm --dir packages/app exec vitest run --config vitest.config.ts --shard=1/4
          - suite: app unit 2/4
            build: >-
              pnpm exec turbo run build --filter=@gitquire/app^...
              && pnpm --dir packages/app exec playwright install --with-deps chromium
            run: pnpm --dir packages/app exec vitest run --config vitest.config.ts --shard=2/4
          - suite: app unit 3/4
            build: >-
              pnpm exec turbo run build --filter=@gitquire/app^...
              && pnpm --dir packages/app exec playwright install --with-deps chromium
            run: pnpm --dir packages/app exec vitest run --config vitest.config.ts --shard=3/4
          - suite: app unit 4/4
            build: >-
              pnpm exec turbo run build --filter=@gitquire/app^...
              && pnpm --dir packages/app exec playwright install --with-deps chromium
            run: pnpm --dir packages/app exec vitest run --config vitest.config.ts --shard=4/4
          - suite: app DOM
            build: pnpm exec turbo run build --filter=@gitquire/app^...
            run: pnpm --dir packages/app exec vitest run --config vitest.dom.config.ts
          - suite: app integration, watching off 1/4
            build: pnpm exec turbo run build --filter=@gitquire/app^...
            run: >-
              GITQUIRE_FILE_WATCHER_BACKEND=off
              pnpm --dir packages/app exec vitest run --config vitest.integration.config.ts --shard=1/4
          - suite: app integration, watching off 2/4
            build: pnpm exec turbo run build --filter=@gitquire/app^...
            run: >-
              GITQUIRE_FILE_WATCHER_BACKEND=off
              pnpm --dir packages/app exec vitest run --config vitest.integration.config.ts --shard=2/4
          - suite: app integration, watching off 3/4
            build: pnpm exec turbo run build --filter=@gitquire/app^...
            run: >-
              GITQUIRE_FILE_WATCHER_BACKEND=off
              pnpm --dir packages/app exec vitest run --config vitest.integration.config.ts --shard=3/4
          - suite: app integration, watching off 4/4
            build: pnpm exec turbo run build --filter=@gitquire/app^...
            run: >-
              GITQUIRE_FILE_WATCHER_BACKEND=off
              pnpm --dir packages/app exec vitest run --config vitest.integration.config.ts --shard=4/4
          - suite: cli
            build: pnpm exec turbo run build --filter=@gitquire/cli...
            run: pnpm --dir packages/cli run test
          - suite: docs
            build: pnpm exec turbo run build --filter=@gitquire/docs^...
            run: pnpm --dir docs run test
          - suite: uncached
            build: pnpm exec turbo run build --filter=@gitquire/server...
            run: pnpm run test:uncached
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: ${{ matrix.build }}

      - name: Test
        run: ${{ matrix.run }}
