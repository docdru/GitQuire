name: Nightly sync test

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/server/src/sync-engine*.ts'
      - 'packages/server/src/gitquire/github-app.ts'
      - 'packages/server/src/gitquire/repo-bootstrap.ts'
      - 'packages/cli/src/commands/gitquire-bootstrap.ts'
      - 'docker/**'
      - 'Dockerfile'
      - 'pnpm-lock.yaml'
      - '.github/scripts/sync-e2e.sh'
      - '.github/workflows/sync-nightly.yml'

concurrency:
  group: sync-test-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TEST_REPO: ${{ vars.GITQUIRE_TEST_REPO }}
      APP_ID: ${{ vars.GITQUIRE_TEST_APP_ID }}
      HAS_KEY: ${{ secrets.GITQUIRE_TEST_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Check the test App is configured
        id: configured
        run: |
          if [ -z "$TEST_REPO" ] || [ -z "$APP_ID" ] || [ "$HAS_KEY" != "true" ]; then
            echo "::notice::Nightly sync test skipped: set the GITQUIRE_TEST_REPO and GITQUIRE_TEST_APP_ID variables and the GITQUIRE_TEST_APP_PRIVATE_KEY secret (see the sync test section in CONTRIBUTING.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "owner=${TEST_REPO%%/*}" >> "$GITHUB_OUTPUT"
            echo "name=${TEST_REPO#*/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.configured.outputs.ready == 'true'

      - name: Installation token for the test repository
        if: steps.configured.outputs.ready == 'true'
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.GITQUIRE_TEST_APP_ID }}
          private-key: ${{ secrets.GITQUIRE_TEST_APP_PRIVATE_KEY }}
          owner: ${{ steps.configured.outputs.owner }}
          repositories: ${{ steps.configured.outputs.name }}

      - name: Create a throwaway branch
        if: steps.configured.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -eu
          branch="sync-test/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          base=$(gh api "repos/${TEST_REPO}" --jq .default_branch)
          sha=$(gh api "repos/${TEST_REPO}/git/ref/heads/${base}" --jq .object.sha)
          gh api -X POST "repos/${TEST_REPO}/git/refs" -f "ref=refs/heads/${branch}" -f "sha=${sha}" >/dev/null
          echo "TEST_BRANCH=${branch}" >> "$GITHUB_ENV"
          echo "Testing on ${TEST_REPO}@${branch} (from ${base} at ${sha})"

      - uses: docker/setup-buildx-action@v3
        if: steps.configured.outputs.ready == 'true'

      - name: Build image
        if: steps.configured.outputs.ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: gitquire:sync-test

      - name: Sync test
        if: steps.configured.outputs.ready == 'true'
        env:
          IMAGE: gitquire:sync-test
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_PRIVATE_KEY: ${{ secrets.GITQUIRE_TEST_APP_PRIVATE_KEY }}
        run: bash .github/scripts/sync-e2e.sh

      - name: Container logs
        if: always() && steps.configured.outputs.ready == 'true'
        run: docker logs gq-sync || true

      - name: Delete the throwaway branch
        if: always() && steps.configured.outputs.ready == 'true' && env.TEST_BRANCH != ''
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          docker rm -f gq-sync || true
          gh api -X DELETE "repos/${TEST_REPO}/git/refs/heads/${TEST_BRANCH}" || true
