[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pr-review-worker"
version = "0.1.0"
description = "GitQuire PR review worker: reviews open pull requests that have no comments yet and posts the review as a PR comment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mistralai-workflows>=3.10",
  "mistralai>=3.0",
  "pydantic>=2.7",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pr_review"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
