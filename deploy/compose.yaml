services:
  gitquire:
    image: ghcr.io/docdru/gitquire:latest
    container_name: gitquire
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: gitquire.env
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      GITQUIRE_DRAFTS_DIR: /drafts
    volumes:
      - gitquire-data:/data
      - gitquire-drafts:/drafts
      - ./app.pem:/run/secrets/app.pem:ro

  mailpit:
    image: axllent/mailpit
    profiles: ["mail-test"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  gitquire-data:
    name: gitquire-data
  gitquire-drafts:
    name: gitquire-drafts
