# GitQuire behind nginx.
#
# 1. Copy to /etc/nginx/sites-available/gitquire.conf and replace wiki.example.com.
# 2. ln -s /etc/nginx/sites-available/gitquire.conf /etc/nginx/sites-enabled/
# 3. nginx -t && systemctl reload nginx
# 4. certbot --nginx -d wiki.example.com
#    Certbot adds the HTTPS listener and the redirect to this file itself.
#    The commented 443 block below is only for setting up HTTPS by hand.
#
# The container publishes its port on the loopback address only:
#   docker run ... -p 127.0.0.1:8080:8080 -e OK_ALLOW_EXTERNAL=1 \
#     -e OK_EXTERNAL_URL=https://wiki.example.com ...
# OK_EXTERNAL_URL must match the address people open, including http or https.

map $http_upgrade $gitquire_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name wiki.example.com;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $gitquire_connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }
}

